name: Generate Resume

on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "Select a job description file from jobs/"
        required: true
        type: choice
        options:
          # job-options:start
          - Swiggy_SDET.txt
          - akemi_solutionArchitect.txt
          - bytedance_backend.txt
          - cohecity_se_2.txt
          - cohera_se.txt
          - docusign_se.txt
          - docusign_se_fe.txt
          - docusign_security.txt
          - google_SE_singapore.txt
          - harness_se_2.txt
          - kotak_fullsack.txt
          - sample_job.txt
          - startup_fullstack.txt
          # job-options:end

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      - name: Validate job file exists
        run: |
          if [ ! -f "jobs/${{ inputs.job_file }}" ]; then
            echo "::error::Job file jobs/${{ inputs.job_file }} not found."
            exit 1
          fi

      - name: Generate resume
        run: |
          python -m resume_builder build --job "jobs/${{ inputs.job_file }}"
          echo "## Generated Resume" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          STEM="${{ inputs.job_file }}"
          STEM="${STEM%.txt}"
          echo "Resume: \`outputs/resume_${STEM}.tex\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze job fit
        run: |
          python -m resume_builder analyze --job "jobs/${{ inputs.job_file }}" --json > analysis.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          analysis = json.loads(Path("analysis.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n\n## Match Analysis\n\n")
              handle.write(f"Selection likelihood: **{analysis['likelihood']} ({analysis['score']}%)**\n\n")
              handle.write("### Strong points\n")
              for item in analysis["strong_points"]:
                  handle.write(f"- {item}\n")
              handle.write("\n### Potential gaps\n")
              for item in analysis["missing_keywords"]:
                  handle.write(f"- {item}\n")
          PY


      - name: Commit generated resume and mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          STEM="${{ inputs.job_file }}"
          STEM="${STEM%.txt}"
          git commit -m "Generate resume for ${STEM}"
          git push
